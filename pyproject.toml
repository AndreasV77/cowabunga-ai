[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prompt-reference"
version = "0.11.0"
description = "Provider-independent, provenance-preserving music prompt reference core"
requires-python = ">=3.11"
authors = [{name = "AndreasV"}]
license = "LicenseRef-Cowabunga-AI-Personal-Use-1.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
prompt-ref = "prompt_reference.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
